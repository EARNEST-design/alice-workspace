schema_version: hardware-manifest/v1
hardware_id: alice-face-v1
controller:
  kind: pololu-maestro
  serial_number: "00037376"

evidence:
  - source: hardware/motor-map.md
    detail: Operator-confirmed semantic channel mapping dated 2026-08-28.
  - source: hardware/reference-motor-calibration.md
    detail: ros2_maestro software calibration and controller export comparison.
  - source: hardware/maestro-00037376-settings-2026-08-28.txt
    detail: Read-only controller-resident Min, Home, Max, speed, and acceleration export.

preflight_requirements:
  - requirement_id: emergency-power-removal-verified
    description: Operator must identify and functionally verify the emergency power-removal procedure before arming.
    satisfied: false
    evidence:
      - source: hardware/reference-motor-calibration.md
        detail: No emergency-stop or deterministic disable evidence is documented.
  - requirement_id: electrical-current-limit-verified
    description: Electrical supply and per-actuator current limits must be measured or established from reviewed documentation.
    satisfied: false
    evidence:
      - source: hardware/reference-motor-calibration.md
        detail: No electrical or current-limit facts are documented.
  - requirement_id: mechanical-clearance-verified
    description: Operator must inspect clearances and confirm the conservative motion envelope immediately before arming.
    satisfied: false
    evidence:
      - source: hardware/motor-map.md
        detail: Physical functions are mapped but linkage clearances and safe travel are not established.
  - requirement_id: channel-10-linkage-inspection
    description: Operator must inspect and freely move the channel 10 linkage because it previously jammed.
    satisfied: false
    evidence:
      - source: hardware/motor-map.md
        detail: Channel 10 linkage was manually freed from a jam during mapping.

