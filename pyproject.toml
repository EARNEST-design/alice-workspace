[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alice"
version = "0.1.0"
description = "Alice robotics perception and learning contracts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mediapipe",
  "numpy",
  "opencv-python-headless",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alice"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["alice"]
