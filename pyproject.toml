[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alice"
version = "0.1.0"
description = "Alice robotics perception and learning contracts"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mediapipe",
  "numpy",
  "opencv-contrib-python",
  "pydantic>=2,<3",
  "pyserial>=3.5,<4",
  "pyyaml",
]

[project.optional-dependencies]
speech = [
  "pocket-tts==3.1.0",
  "sounddevice==0.5.6",
]
ml = [
  "safetensors>=0.8.0",
  "torch>=2.14.0",
]

[project.scripts]
alice-speak = "alice.speech.cli:main"
alice-jaw-trial = "alice.experiments.jaw_trial_cli:main"
alice-camera = "alice.perception.cli:main"
alice-passive-capture = "alice.experiments.passive_capture:main"
alice-hardware-preflight = "alice.experiments.hardware_cli:main"
alice-hardware-run = "alice.experiments.hardware_run_cli:main"
alice-motion-readiness = "alice.experiments.motion_readiness_cli:main"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
  "safetensors>=0.8.0",
  "torch>=2.14.0",
  "types-pyserial",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/alice"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev"]
managed = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["alice"]
